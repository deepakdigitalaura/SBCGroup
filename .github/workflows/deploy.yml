name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "php-export/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload php-export to Hostinger via SFTP
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          SOURCE: "php-export/"
          TARGET: "/home/u904188006/domains/sbcgroup.in/public_html/"
          ARGS: "-avzr --delete-after"
          EXCLUDE: "/config.php, /data/submissions.jsonl"
